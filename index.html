<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escoteiro Quest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* General Arcade Theme */
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #5c94fc; /* Mario sky blue */
            color: #ffffff;
            text-transform: uppercase;
            image-rendering: pixelated; /* Ensures images/SVGs look crisp */
        }

        /* Main Game Window */
        .card {
            background-color: #000000;
            border: 4px solid #ffffff;
            padding: 2rem;
            box-shadow: none;
            border-radius: 0;
            width: 100%;
        }
        
        /* Text Styles */
        h1, h2 {
            color: #facc15; /* Yellow for titles */
            line-height: 1.4;
        }

        p, span, div, label {
             line-height: 1.6;
        }

        /* Buttons */
        .btn {
            display: block;
            width: 100%;
            text-align: center;
            padding: 1rem;
            border: 4px solid #ffffff;
            font-family: 'Press Start 2P', cursive;
            font-weight: normal;
            font-size: 1rem;
            cursor: pointer;
            transition: none;
            color: #ffffff;
            background-color: #000000;
            border-radius: 0;
            image-rendering: pixelated;
        }

        .btn:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .btn-primary {
            background-color: #22c55e; /* Green for start/restart */
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: #16a34a;
        }
        .btn-secondary {
            background-color: #f97316;
        }
        .btn-secondary:hover {
            background-color: #ea580c;
        }

        /* Answer buttons styled like bricks */
        .btn-answer {
            background-color: #a16207; 
        }
        .btn-answer:hover {
            background-color: #ca8a04;
        }
        .btn-answer.correct {
            background-color: #22c55e;
        }
        .btn-answer.incorrect {
            background-color: #ef4444;
        }
        .btn-answer:disabled {
            opacity: 1;
            color: #ffffff;
        }
        .btn-answer:disabled:not(.correct):not(.incorrect) {
            background-color: #4b5563; /* Gray for unselected answers */
        }

        /* Timer animation */
        @keyframes blink {
            50% { opacity: 0; }
        }
        .tense {
            color: #ef4444;
            animation: blink 1s step-end infinite;
        }

        /* Quit Button */
        #quit-button {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            background-color: #ef4444;
            color: white;
            width: 4rem;
            height: 4rem;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            border: 4px solid #fff;
        }
        #quit-button:hover {
            transform: none;
            background-color: #dc2626;
        }
        
        /* Progress Bar */
        .progress-container {
            background-color: #000000;
            border: 2px solid #fff;
            padding: 4px;
        }
        #progress-bar {
            background-color: #facc15;
            height: 1rem;
            width: 0%;
            transition: width 0.3s linear;
            border-radius: 0;
        }
        
        /* High Scores */
        #high-scores-container {
            max-height: 200px;
            overflow-y: auto;
            border: 2px solid #fff;
            padding: 1rem;
            margin-top: 1.5rem;
            background-color: #1f2937;
        }
         #high-scores-container::-webkit-scrollbar {
            width: 8px;
        }
        #high-scores-container::-webkit-scrollbar-track {
            background: #000;
        }
        #high-scores-container::-webkit-scrollbar-thumb {
            background: #fff;
        }

        /* Form Inputs */
        .form-input {
            width: 100%;
            background-color: #1f2937;
            border: 2px solid #fff;
            color: #fff;
            padding: 0.5rem;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 space-y-4">

    <!-- Status Bar with Coins and Timer -->
    <div id="status-bar" class="card w-full max-w-lg hidden">
        <div class="flex justify-between items-center">
            <div id="coin-counter" class="flex items-center text-lg font-bold">
                 <svg class="w-8 h-8 mr-2" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated;">
                    <path fill="#FBBF24" d="M5,1 h6 v1 h1 v1 h1 v8 h-1 v1 h-1 v1 h-6 v-1 h-1 v-1 h-1 v-8 h1 v-1 h1z" />
                    <path fill="#F59E0B" d="M6,2 h4 v1 h1 v1 h1 v6 h-1 v1 h-1 v1 h-4 v-1 h-1 v-1 h-1 v-6 h1 v-1 h1z" />
                    <path fill="#D97706" d="M7,5 v1 h-1 v2 h1 v1 h2 v-1 h1 v-2 h-1 v-1z" />
                </svg>
                <span>COINS: </span>
                <span id="coin-count" class="ml-2">0</span>
            </div>
            <div id="timer" class="text-2xl font-bold transition-colors duration-300">60s</div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="card text-center max-w-lg w-full">
        <h1 class="text-3xl font-bold mb-4">Tropa Quest</h1>
        <p class="mb-8">Prepare-se! 3 acertos = 1 moeda. Você tem 60 segundos!</p>
        <button id="start-button" class="btn btn-primary mb-6">Start</button>
        
        <h2 class="text-xl mb-4">Hall da Fama</h2>
        <div id="high-scores-container">
            <p>Nenhuma pontuação salva ainda.</p>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="card max-w-lg w-full hidden">
        <div class="mb-6">
            <div class="flex justify-between items-center mb-2 text-sm">
                <span>COIN METER</span>
            </div>
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
        </div>
        <div class="flex justify-between items-center mb-6">
            <div id="question-counter" class="text-sm font-semibold"></div>
        </div>
        <h2 id="question-text" class="text-xl mb-6 text-center"></h2>
        <div id="answers-container" class="space-y-3">
        </div>
    </div>

    <!-- End Screen -->
    <div id="end-screen" class="card text-center max-w-lg w-full hidden">
        <h1 class="text-3xl font-bold mb-4">Game Over</h1>
        <p id="score-text" class="mb-6 text-lg"></p>
        
        <form id="score-form" class="space-y-4 text-left text-sm">
            <div>
                <label for="player-name">Nome</label>
                <input type="text" id="player-name" class="form-input" required>
            </div>
            <div>
                <label for="player-patrol">Patrulha</label>
                <input type="text" id="player-patrol" class="form-input">
            </div>
            <div>
                <label for="player-troop">Tropa</label>
                <input type="text" id="player-troop" class="form-input">
            </div>
             <div>
                <label for="player-group">Grupo Escoteiro</label>
                <input type="text" id="player-group" class="form-input">
            </div>
            <div class="pt-4 space-y-3">
                <button type="submit" class="btn btn-primary">Salvar Pontuação</button>
                <button type="button" id="restart-button" class="btn btn-secondary">Jogar Novamente (Não Salvar)</button>
            </div>
        </form>
    </div>
    
    <button id="quit-button" class="hidden" title="Abandonar Quiz">X</button>

    <script>
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const endScreen = document.getElementById('end-screen');
        const statusBar = document.getElementById('status-bar');
        const startButton = document.getElementById('start-button');
        const restartButton = document.getElementById('restart-button');
        const quitButton = document.getElementById('quit-button');
        const timerElement = document.getElementById('timer');
        const questionCounterElement = document.getElementById('question-counter');
        const questionTextElement = document.getElementById('question-text');
        const answersContainer = document.getElementById('answers-container');
        const scoreTextElement = document.getElementById('score-text');
        const progressBar = document.getElementById('progress-bar');
        const coinCountElement = document.getElementById('coin-count');
        const scoreForm = document.getElementById('score-form');
        const highScoresContainer = document.getElementById('high-scores-container');

        let allQuestions = [];
        let highScores = [];
        let currentQuestionIndex;
        let score;
        let timeLeft;
        let timerInterval;
        let currentQuizQuestions;
        let coins;
        let correctAnswersForCoin;
        let gameIsOver;

        function loadHighScores() {
            const scoresJSON = localStorage.getItem('escoteiroQuestScores');
            if (scoresJSON) {
                highScores = JSON.parse(scoresJSON);
            }
        }

        function displayHighScores() {
            highScoresContainer.innerHTML = '';
            if (highScores.length === 0) {
                highScoresContainer.innerHTML = '<p>Nenhuma pontuação salva ainda.</p>';
                return;
            }

            highScores.sort((a, b) => b.score - a.score || b.coins - a.coins);

            highScores.forEach(s => {
                const scoreElement = document.createElement('div');
                scoreElement.className = 'text-left text-sm mb-2 border-b border-gray-600 pb-2';
                scoreElement.innerHTML = `
                    <p><strong>${s.name}</strong> - ${s.score} Pts, ${s.coins} Moedas</p>
                    <p class="text-xs text-gray-400">${s.patrol} / ${s.group}</p>
                `;
                highScoresContainer.appendChild(scoreElement);
            });
        }
        
        async function fetchQuestions() {
            if (allQuestions.length === 0) {
                try {
                    const newQuestions = [
                        {
                            "question": "Qual é a ordem correta dos Distintivos de Progressão?",
                            "answers": ["Pistas, Trilha, Rumo, Travessia", "Trilha, Pistas, Rumo, Travessia", "Pistas, Rumo, Trilha, Travessia", "Travessia, Rumo, Trilha, Pistas"], "correct": 0
                        },
                        {
                            "question": "Qual distintivo vem imediatamente DEPOIS de 'Pistas'?",
                            "answers": ["Rumo", "Trilha", "Travessia", "Lis de Ouro"], "correct": 1
                        },
                        {
                            "question": "Qual distintivo vem ANTES de 'Travessia'?",
                            "answers": ["Pistas", "Trilha", "Rumo", "Lis de Ouro"], "correct": 2
                        },
                        {
                            "question": "Qual é o primeiro distintivo de progressão que um escoteiro geralmente recebe?",
                            "answers": ["Rumo", "Travessia", "Pistas", "Lis de Ouro"], "correct": 2
                        },
                        {
                            "question": "Qual é a etapa final da progressão, antes da transição para o Ramo Sênior?",
                            "answers": ["Conquistar o distintivo de Trilha", "Conquistar o Cordão Verde e Amarelo", "Conquistar a Lis de Ouro", "Completar a etapa Rumo"], "correct": 2
                        },
                        {
                            "question": "Para passar de 'Pistas' para 'Trilha', o que você precisa fazer?",
                            "answers": ["Metade das atividades de Pistas e Trilhas", "Todas as atividades de Pistas", "Uma noite de acampamento", "Conquistar 3 especialidades"], "correct": 0
                        },
                        {
                            "question": "O que é necessário para conquistar o distintivo 'Rumo' depois de 'Trilha'?",
                            "answers": ["50% das atividades de Rumo", "100% das atividades de Pistas e Trilhas", "Ser monitor de patrulha", "Ganhar uma competição"], "correct": 1
                        },
                        {
                            "question": "Para receber o distintivo 'Travessia' depois de 'Rumo', o que é preciso?",
                            "answers": ["Metade das atividades de Rumo e Travessia", "100% das atividades de Travessia", "Conquistar o Cordão Vermelho e Branco", "Ter 10 especialidades"], "correct": 0
                        },
                        {
                            "question": "O que você recebe ao final do Período Introdutório na Cerimônia de Integração?",
                            "answers": ["Apenas o seu primeiro distintivo", "Apenas o lenço do Grupo", "O lenço e o seu primeiro distintivo", "O Cordão Verde e Amarelo"], "correct": 2
                        },
                        {
                            "question": "Para a Lis de Ouro, qual cordão é um requisito obrigatório?",
                            "answers": ["Verde e Amarelo", "Vermelho e Branco", "Azul e Branco", "Não precisa de cordão"], "correct": 1
                        },
                        {
                            "question": "Quantas noites de acampamento, no mínimo, são necessárias para a Lis de Ouro?",
                            "answers": ["5 noites", "20 noites", "10 noites", "Nenhuma"], "correct": 2
                        },
                        {
                            "question": "Para a Lis de Ouro, é preciso ter uma Insígnia da Modalidade?",
                            "answers": ["Sim, qualquer uma do Ramo", "Não, é opcional", "Sim, a de Aviador", "Apenas se for da Modalidade do Ar"], "correct": 0
                        },
                        {
                            "question": "Para a Lis de Ouro, quais atividades dos guias precisam ser completadas?",
                            "answers": ["Todas de Pistas e Trilhas", "Metade de Rumo e Travessia", "Todas de Rumo e Travessia", "Nenhuma, apenas especialidades"], "correct": 2
                        },
                        {
                            "question": "Qual destes é um requisito para a Lis de Ouro?",
                            "answers": ["Ser monitor por um ano", "Possuir uma Insígnia de Interesse Especial", "Ter 15 especialidades", "Ganhar um acampamento de patrulhas"], "correct": 1
                        },
                        {
                            "question": "Quem precisa te recomendar para a Lis de Ouro?",
                            "answers": ["Apenas seus pais", "Apenas o monitor da sua patrulha", "Os escotistas e a Corte de Honra", "O diretor do Grupo Escoteiro"], "correct": 2
                        },
                        {
                            "question": "Como se chama o primeiro período de um novo membro na Tropa Escoteira?",
                            "answers": ["Período de Testes", "Período Introdutório", "Semana do Escoteiro", "Acampamento de Noviços"], "correct": 1
                        },
                        {
                            "question": "Qual o nome do distintivo máximo do Ramo Escoteiro?",
                            "answers": ["Distintivo de Cruzeiro do Sul", "Distintivo de Escoteiro da Pátria", "Distintivo de Escoteiro Lis de Ouro", "Distintivo de Insígnia de BP"], "correct": 2
                        },
                        {
                            "question": "Explorador, Grumete e Aviador são exemplos de quê?",
                            "answers": ["Nomes de patrulhas", "Insígnias de Interesse Especial", "Distintivos de Progressão", "Insígnias da Modalidade"], "correct": 3
                        },
                        {
                            "question": "O Cordão Verde e Amarelo e o Vermelho e Branco são chamados de:",
                            "answers": ["Cordões de Honra", "Cordões de Eficiência", "Cordões de Liderança", "Cordões de Patrulha"], "correct": 1
                        },
                        {
                            "question": "Onde você pode encontrar todas as informações sobre as atividades da sua progressão?",
                            "answers": ["No site da União dos Escoteiros", "Nos guias da 'Aventura Escoteira'", "Perguntando a um Sênior", "No manual do Ramo Lobinho"], "correct": 1
                        }
                    ];
                    allQuestions = newQuestions;
                    try {
                        const response = await fetch('perguntas.json');
                         if (response.ok) {
                             const fetchedQuestions = await response.json();
                             if(fetchedQuestions.length > 0) allQuestions = fetchedQuestions;
                        }
                    } catch (fetchError) {
                        console.warn("Could not fetch 'perguntas.json', using embedded questions.", fetchError);
                    }
                } catch (error) {
                    console.error("Could not load questions:", error);
                }
            }
        }

        async function startGame() {
            await fetchQuestions();
            if (allQuestions.length === 0) return;

            gameIsOver = false;
            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            statusBar.classList.remove('hidden');
            quitButton.classList.remove('hidden');
            timerElement.classList.remove('tense');
            currentQuestionIndex = 0;
            score = 0;
            coins = 0;
            correctAnswersForCoin = 0;
            updateCoinDisplay();
            updateProgressBar();
            const shuffledQuestions = [...allQuestions].sort(() => Math.random() - 0.5);
            currentQuizQuestions = shuffledQuestions.slice(0, 15); 
            startTimer();
            showQuestion();
        }

        function showQuestion() {
            if (currentQuestionIndex >= currentQuizQuestions.length) {
                endGame();
                return;
            }
            const currentQuestion = currentQuizQuestions[currentQuestionIndex];
            questionCounterElement.textContent = `Quest ${currentQuestionIndex + 1} of ${currentQuizQuestions.length}`;
            questionTextElement.textContent = currentQuestion.question;
            answersContainer.innerHTML = '';
            const indexedAnswers = currentQuestion.answers.map((answer, index) => ({ text: answer, originalIndex: index }));
            const shuffledAnswers = indexedAnswers.sort(() => Math.random() - 0.5);
            shuffledAnswers.forEach(({ text, originalIndex }) => {
                const button = document.createElement('button');
                button.textContent = text;
                button.classList.add('btn', 'btn-answer');
                button.addEventListener('click', (event) => selectAnswer(originalIndex, event));
                answersContainer.appendChild(button);
            });
        }

        function selectAnswer(selectedIndex, event) {
            const currentQuestion = currentQuizQuestions[currentQuestionIndex];
            const isCorrect = selectedIndex === currentQuestion.correct;
            const buttons = Array.from(answersContainer.children);
            buttons.forEach(button => button.disabled = true);
            const clickedButton = event.target;
            if (isCorrect) {
                score++;
                correctAnswersForCoin++;
                if (correctAnswersForCoin === 3) {
                    coins++;
                    correctAnswersForCoin = 0;
                    updateCoinDisplay();
                }
                updateProgressBar();
                clickedButton.classList.add('correct');
            } else {
                clickedButton.classList.add('incorrect');
                const correctButtonText = currentQuestion.answers[currentQuestion.correct];
                const correctButton = buttons.find(b => b.textContent === correctButtonText);
                if(correctButton) correctButton.classList.add('correct');
            }
            setTimeout(() => {
                currentQuestionIndex++;
                if (timeLeft > 0) {
                    showQuestion();
                } else {
                    endGame();
                }
            }, 1200);
        }
        
        function updateProgressBar() {
            const progressPercentage = (correctAnswersForCoin / 3) * 100;
            progressBar.style.width = `${(correctAnswersForCoin / 3) * 100}%`;
        }

        function updateCoinDisplay() {
            coinCountElement.textContent = coins;
        }

        function startTimer() {
            timeLeft = 60;
            timerElement.textContent = `${timeLeft}s`;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerElement.textContent = `${timeLeft}s`;
                if (timeLeft <= 10 && timeLeft > 0) timerElement.classList.add('tense');
                if (timeLeft <= 0 && !gameIsOver) {
                    endGame();
                }
            }, 1000);
        }
        
        function returnToStart() {
            gameIsOver = true;
            clearInterval(timerInterval);
            quizScreen.classList.add('hidden');
            statusBar.classList.add('hidden');
            endScreen.classList.add('hidden');
            quitButton.classList.add('hidden');
            startScreen.classList.remove('hidden');
            displayHighScores();
        }

        function endGame() {
            if (gameIsOver) return;
            gameIsOver = true;
            clearInterval(timerInterval);
            quizScreen.classList.add('hidden');
            statusBar.classList.add('hidden');
            quitButton.classList.add('hidden');
            endScreen.classList.remove('hidden');
            scoreTextElement.innerHTML = `Você fez <span>${score}</span> pontos e coletou <span>${coins}</span> moeda(s).`;
            scoreForm.reset();
        }
        
        function saveScore(event) {
            event.preventDefault();
            const playerName = document.getElementById('player-name').value;
            if (!playerName.trim()) {
                alert("O nome não pode ficar em branco!");
                return;
            }
            const newScore = {
                name: playerName,
                patrol: document.getElementById('player-patrol').value || 'N/A',
                troop: document.getElementById('player-troop').value || 'N/A',
                group: document.getElementById('player-group').value || 'N/A',
                score: score,
                coins: coins
            };
            highScores.push(newScore);
            localStorage.setItem('escoteiroQuestScores', JSON.stringify(highScores));
            returnToStart();
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadHighScores();
            displayHighScores();
        });
        
        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', returnToStart);
        quitButton.addEventListener('click', returnToStart);
        scoreForm.addEventListener('submit', saveScore);
    </script>
</body>
</html>
